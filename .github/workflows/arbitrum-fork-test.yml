name: Testnet Fork Tests

# Manual only: forks live testnet state through public RPCs, which are too slow and flaky for every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-test:
    name: Fork tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arbitrum Sepolia
            chain-id: 421614
            rpc-secret: ARBITRUM_SEPOLIA_RPC
            public-rpc: https://sepolia-rollup.arbitrum.io/rpc
          - name: Robinhood Chain Testnet
            chain-id: 46630
            rpc-secret: ''
            public-rpc: https://rpc.testnet.chain.robinhood.com
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Check the RPC serves the expected chain
        env:
          FORK_RPC_URL: ${{ (matrix.rpc-secret && secrets[matrix.rpc-secret]) || matrix.public-rpc }}
        run: |
          actual="$(cast chain-id --rpc-url "$FORK_RPC_URL")"
          if [ "$actual" != "${{ matrix.chain-id }}" ]; then
            echo "::error::RPC reports chain $actual, expected ${{ matrix.chain-id }}"
            exit 1
          fi

      # Fork tests skip themselves without a deployment record, so the chain check above is what
      # keeps a misconfigured RPC from passing with zero tests run.
      - name: Run fork tests against deployments/x402-${{ matrix.chain-id }}.json
        env:
          FORK_RPC_URL: ${{ (matrix.rpc-secret && secrets[matrix.rpc-secret]) || matrix.public-rpc }}
        run: |
          cd contracts
          forge test --fork-url "$FORK_RPC_URL" --match-contract ForkTest -vvv
