name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install web dependencies
        run: cd web && npm ci
      - name: Lint
        run: cd web && npm run lint
      - name: Build
        run: cd web && npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: cd contracts && forge build
      - name: Test
        run: cd contracts && forge test -vvv

  x402-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: x402-server/package-lock.json
      - name: Install dependencies
        run: cd x402-server && npm ci
      - name: Test
        run: cd x402-server && npm test
