[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
# Arbitrum L2 specific: higher block gas limit
gas_limit = 30000000

# Fork testing configuration for Arbitrum Sepolia
[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum_sepolia_public = "https://sepolia-rollup.arbitrum.io/rpc"
robinhood_testnet = "https://sepolia.rpc.robinhood.com"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }

[profile.slither]
optimizer = false
